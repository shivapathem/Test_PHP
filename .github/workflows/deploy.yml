
name: Deploy PHP Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Notify Deployment Start
        shell: powershell
        run: |
          Write-Host "Deployment Started"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # ✅ FIX TEMP
      - name: Fix Temp Directory
        shell: powershell
        run: |
          $env:TEMP = "C:\Temp"
          $env:TMP = "C:\Temp"
          New-Item -ItemType Directory -Force -Path C:\Temp

      # ✅ COMPOSER CACHE
      - name: Set Composer Cache
        shell: powershell
        run: |
          $env:COMPOSER_CACHE_DIR = "C:\composer-cache"
          New-Item -ItemType Directory -Force -Path C:\composer-cache

      # ✅ CLEAR CACHE
      - name: Clear Composer Cache
        shell: powershell
        run: |
          & "C:\composer\composer.bat" clear-cache

      # ✅ CLEAN OLD VENDOR
      - name: Clean Vendor Folder
        shell: powershell
        run: |
          if (Test-Path vendor) { Remove-Item vendor -Recurse -Force }

      # ✅ INSTALL DEPENDENCIES (NO AUTOLOAD TO AVOID WINDOWS ISSUE)
      - name: Install Composer Dependencies
        shell: powershell
        run: |
          & "C:\composer\composer.bat" install `
            --no-dev `
            --prefer-dist `
            --no-scripts `
            --no-autoloader

      # ✅ CREATE ZIP (FLATTEN STRUCTURE)
      - name: Create Deployment Package
        shell: powershell
        run: |
          Compress-Archive -Path .\* -DestinationPath deploy.zip -Force

      # ✅ STOP IIS WEBSITE
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "${{ secrets.IIS_SITE_NAME }}"

      # ✅ CLEAN TARGET DIRECTORY BEFORE DEPLOY
      - name: Clean IIS Folder
        shell: powershell
        run: |
          Remove-Item "${{ secrets.DEPLOY_PATH }}\*" -Recurse -Force -ErrorAction SilentlyContinue

      # ✅ COPY FILES
      - name: Copy Files to IIS
        shell: powershell
        run: |
          Expand-Archive -Path deploy.zip -DestinationPath "${{ secrets.DEPLOY_PATH }}" -Force

      # ✅ DEBUG (IMPORTANT - verifies artisan exists)
      - name: Verify Deployment Structure
        shell: powershell
        run: |
          Get-ChildItem "${{ secrets.DEPLOY_PATH }}"
          if (!(Test-Path "${{ secrets.DEPLOY_PATH }}\artisan")) {
            Write-Host "ERROR: artisan file not found!"
            exit 1
          }

      # ✅ CREATE REQUIRED FILES
      - name: Create Required Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ secrets.DEPLOY_PATH }}\storage\logs"
          New-Item -ItemType File -Force -Path "${{ secrets.DEPLOY_PATH }}\storage\logs\laravel.log"

      # ✅ SET PERMISSIONS (FIXED QUOTES)
      - name: Set Folder Permissions
        shell: powershell
        run: |
          icacls "${{ secrets.DEPLOY_PATH }}\storage" /grant "IIS_IUSRS:(OI)(CI)F" /T

      # ✅ RUN LARAVEL COMMANDS (NOW SAFE)
      - name: Run Laravel Commands
        shell: powershell
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate --force

      # ✅ START IIS WEBSITE
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Website -Name "${{ secrets.IIS_SITE_NAME }}"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          Write-Host "Deployment Completed Successfully"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "Deployment Failed"
