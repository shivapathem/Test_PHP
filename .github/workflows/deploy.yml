
name: Deploy PHP Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # ✅ FIX TEMP
      - name: Fix Temp Directory
        shell: powershell
        run: |
          $env:TEMP = "C:\Temp"
          $env:TMP = "C:\Temp"
          New-Item -ItemType Directory -Force -Path C:\Temp

      # ✅ INSTALL COMPOSER FROM ROOT (IMPORTANT FIX)
      - name: Install Composer Dependencies
        shell: powershell
        run: |
          & "C:\composer\composer.bat" install --no-dev --prefer-dist --no-scripts

      # ✅ CREATE ZIP ONLY FROM src (LARAVEL APP)
      - name: Create Deployment Package
        shell: powershell
        run: |
          Compress-Archive -Path .\src\* -DestinationPath deploy.zip -Force

      # ✅ STOP IIS
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "${{ secrets.IIS_SITE_NAME }}"

      # ✅ CLEAN IIS FOLDER
      - name: Clean IIS Folder
        shell: powershell
        run: |
          Remove-Item "${{ secrets.DEPLOY_PATH }}\*" -Recurse -Force -ErrorAction SilentlyContinue

      # ✅ DEPLOY FILES
      - name: Copy Files to IIS
        shell: powershell
        run: |
          Expand-Archive -Path deploy.zip -DestinationPath "${{ secrets.DEPLOY_PATH }}" -Force

      # ✅ VERIFY ARTISAN
      - name: Verify Deployment Structure
        shell: powershell
        run: |
          Get-ChildItem "${{ secrets.DEPLOY_PATH }}"
          if (!(Test-Path "${{ secrets.DEPLOY_PATH }}\artisan")) {
            Write-Host "ERROR: artisan file not found!"
            exit 1
          }

      # ✅ STORAGE FILES
      - name: Create Storage Directory
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "${{ secrets.DEPLOY_PATH }}\storage\logs"
          New-Item -ItemType File -Force -Path "${{ secrets.DEPLOY_PATH }}\storage\logs\laravel.log"

      # ✅ PERMISSIONS
      - name: Set Folder Permissions
        shell: powershell
        run: |
          icacls "${{ secrets.DEPLOY_PATH }}\storage" /grant "IIS_IUSRS:(OI)(CI)F" /T

      # ✅ LARAVEL COMMANDS
      - name: Run Laravel Commands
        shell: powershell
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate --force

      # ✅ START IIS
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Website -Name "${{ secrets.IIS_SITE_NAME }}"
