
name: Deploy PHP Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Notify Deployment Start
        shell: powershell
        run: |
          Write-Host "Deployment Started"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # ✅ TEMP FIX
      - name: Fix Temp Directory
        shell: powershell
        run: |
          $env:TEMP = "C:\Temp"
          $env:TMP = "C:\Temp"
          New-Item -ItemType Directory -Force -Path C:\Temp

      # ✅ COMPOSER CACHE
      - name: Set Composer Cache
        shell: powershell
        run: |
          $env:COMPOSER_CACHE_DIR = "C:\composer-cache"
          New-Item -ItemType Directory -Force -Path C:\composer-cache

      # ✅ CLEAR CACHE
      - name: Clear Composer Cache
        shell: powershell
        run: |
          & "C:\composer\composer.bat" clear-cache

      # ✅ CLEAN VENDOR
      - name: Clean Vendor Folder
        shell: powershell
        run: |
          if (Test-Path vendor) { Remove-Item vendor -Recurse -Force }

      # ✅ INSTALL DEPENDENCIES (NO AUTOLOAD)
      - name: Install Composer Dependencies
        shell: powershell
        run: |
          & "C:\composer\composer.bat" install `
            --no-dev `
            --prefer-dist `
            --no-scripts `
            --no-autoloader

      # ✅ CREATE ZIP
      - name: Create Deployment Package
        shell: powershell
        run: |
          Compress-Archive -Path * -DestinationPath deploy.zip -Force

      # ✅ STOP IIS
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "${{ secrets.IIS_SITE_NAME }}"

      # ✅ DEPLOY FILES
      - name: Copy Files to IIS
        shell: powershell
        run: |
          Expand-Archive deploy.zip -DestinationPath "${{ secrets.DEPLOY_PATH }}" -Force

      # ✅ CREATE REQUIRED FILES
      - name: Create Required Files
        shell: powershell
        run: |
          New-Item -Path "${{ secrets.DEPLOY_PATH }}\storage\logs\laravel.log" -ItemType File -Force

      # ✅ PERMISSIONS
      - name: Set Folder Permissions
        shell: powershell
        run: |
          icacls "${{ secrets.DEPLOY_PATH }}\storage" /grant IIS_IUSRS:(OI)(CI)F /T

      # ✅ LARAVEL COMMANDS
      - name: Run Laravel Commands
        shell: powershell
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate --force

      # ✅ START IIS
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Website -Name "${{ secrets.IIS_SITE_NAME }}"

      - name: Notify Success
        if: success()
        shell: powershell
        run: |
          Write-Host "Deployment Completed Successfully"

      - name: Notify Failure
        if: failure()
        shell: powershell
        run: |
          Write-Host "Deployment Failed"
