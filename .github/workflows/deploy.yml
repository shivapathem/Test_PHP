
name: Deploy PHP Application

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      # ✅ INSTALL DEPENDENCIES IN LARAVEL FOLDER
      - name: Install Composer Dependencies
        shell: powershell
        run: |
          cd backend   # <-- CHANGE THIS
          & "C:\composer\composer.bat" install --no-dev --prefer-dist

      # ✅ PACKAGE ONLY LARAVEL APP
      - name: Create Deployment Package
        shell: powershell
        run: |
          Compress-Archive -Path .\backend\* -DestinationPath deploy.zip -Force

      # ✅ STOP IIS
      - name: Stop IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "${{ secrets.IIS_SITE_NAME }}"

      # ✅ CLEAN IIS
      - name: Clean IIS Folder
        shell: powershell
        run: |
          Remove-Item "${{ secrets.DEPLOY_PATH }}\*" -Recurse -Force -ErrorAction SilentlyContinue

      # ✅ DEPLOY
      - name: Copy Files to IIS
        shell: powershell
        run: |
          Expand-Archive -Path deploy.zip -DestinationPath "${{ secrets.DEPLOY_PATH }}" -Force

      # ✅ VERIFY ARTISAN
      - name: Verify Laravel Deployment
        shell: powershell
        run: |
          if (!(Test-Path "${{ secrets.DEPLOY_PATH }}\artisan")) {
            Write-Host "ERROR: Laravel not deployed correctly!"
            exit 1
          }

      # ✅ PERMISSIONS
      - name: Set Permissions
        shell: powershell
        run: |
          icacls "${{ secrets.DEPLOY_PATH }}\storage" /grant "IIS_IUSRS:(OI)(CI)F" /T

      # ✅ 🔥 RUN ARTISAN (THIS WILL NOW WORK)
      - name: Run Laravel Commands
        shell: powershell
        run: |
          cd "${{ secrets.DEPLOY_PATH }}"
          php artisan config:clear
          php artisan cache:clear
          php artisan migrate --force

      # ✅ START IIS
      - name: Start IIS Website
        shell: powershell
        run: |
          Import-Module WebAdministration
          Start-Website -Name "${{ secrets.IIS_SITE_NAME }}"
