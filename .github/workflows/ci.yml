
name: CI-CD PHP App with Artifacts to IIS

on:
  push:
    branches:
      - main

jobs:
# ============================================================
# CI JOB – BUILD & PACKAGE ARTIFACT
# ============================================================
  build:
    name: CI - Build & Package Artifact
    runs-on: [self-hosted, windows, x64]

    steps:
      # --------------------------------------------------------
      # Checkout source code
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Verify PHP is available
      # --------------------------------------------------------
      - name: Verify PHP
        shell: pwsh
        run: php -v

      # --------------------------------------------------------
      # PHP Syntax Check (CI)
      # --------------------------------------------------------
      - name: PHP Syntax Check
        shell: pwsh
        run: |
          Write-Host "Running PHP syntax check..."
          Get-ChildItem -Recurse -Filter *.php . |
          ForEach-Object {
            & php -l $_.FullName
          }

      # --------------------------------------------------------
      # Package artifact (ZIP)
      # --------------------------------------------------------
      - name: Create artifact ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\* `
            -DestinationPath app-artifact.zip `
            -Force

      # --------------------------------------------------------
      # Upload artifact
      # --------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app-artifact
          path: app-artifact.zip


# ============================================================
# CD JOB – DEPLOY ARTIFACT TO IIS
# ============================================================
  deploy:
    name: CD - Deploy Artifact to IIS
    needs: build
    runs-on: [self-hosted, windows, x64]

    steps:
      # --------------------------------------------------------
      # Download artifact
      # --------------------------------------------------------
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app-artifact

      # --------------------------------------------------------
      # Stop IIS Website
      # --------------------------------------------------------
      - name: Stop IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "Default Web Site"

      # --------------------------------------------------------
      # Deploy artifact to IIS directory
      # --------------------------------------------------------
      - name: Deploy artifact to IIS
        shell: pwsh
        run: |
          Expand-Archive `
            -Path app-artifact.zip `
            -DestinationPath "C:\inetpub\wwwroot\TestPHP" `
            -Force

      # --------------------------------------------------------
      # Start IIS Website
      # --------------------------------------------------------
      - name: Start IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Start-Website -Name "Default Web Site"

      # --------------------------------------------------------
      # Verify IIS Site Status
      # --------------------------------------------------------
      - name: Verify IIS Site
        shell: pwsh
        run: |
          Get-Website | Select-Object Name, State
