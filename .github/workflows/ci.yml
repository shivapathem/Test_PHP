name: PHP CI + SonarQube
 
on:
  push:
    branches: [dev, qa]
  pull_request:
    branches: [dev, qa]
 
jobs:
  build-and-analyze:
    runs-on: [self-hosted, windows]
 
    defaults:
      run:
        shell: powershell
 
    steps:
      # Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
 
      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: xdebug, fileinfo, mbstring, openssl, pdo, curl, xml
 
      # Install dependencies
      - name: Install Dependencies
        working-directory: src/mvc-app
        run: composer install --no-interaction --prefer-dist --no-progress
 
      # Run tests
      - name: Run PHPUnit Tests
        working-directory: src/mvc-app
        run: vendor/bin/phpunit tests/Unit/AllocateUsers --log-junit test-report.xml
 
      # SonarQube Scan (NO manual download needed)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        with:
          args: >
            -Dsonar.projectKey=Allocater
            -Dsonar.projectName=Allocater
            -Dsonar.sources=src/mvc-app
            -Dsonar.tests=src/mvc-app/tests
            -Dsonar.php.tests.reportPath=src/mvc-app/test-report.xml
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }}
            -Dsonar.login=${{ secrets.SONAR_TOKEN }}
