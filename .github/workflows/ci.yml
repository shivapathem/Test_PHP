name: PHP CI + SonarQube
 
on:
  push:
    branches:
      - dev
      - qa
  pull_request:
    branches:
      - dev
      - qa
 
jobs:
  build-and-analyze:
    runs-on:
      - self-hosted
      - windows
 
    defaults:
      run:
        shell: powershell
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          clean: true
 
      - name: Verify PHP
        run: php -v
 
      - name: Install Dependencies
        working-directory: src/mvc-app
        run: composer install --no-interaction --prefer-dist
 
      - name: Run All Unit Tests
        working-directory: src/mvc-app
        run: |
          .\vendor\bin\phpunit ..\tests\Unit --log-junit test-report.xml --coverage-clover coverage.xml
 
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=allocate7_fast_bau_scheduling_group
            -Dsonar.projectName=Allocate7 Fast Bau Scheduling Group
            -Dsonar.sources=src/mvc-app
            -Dsonar.tests=src/tests/Unit
            -Dsonar.php.tests.reportPath=src/mvc-app/test-report.xml
            -Dsonar.php.coverage.reportPaths=src/mvc-app/coverage.xml
            -Dsonar.sourceEncoding=UTF-8
 
      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1.1.0
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
