
name: PHP CI Build & Artifact

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build PHP Application
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      # Step 3: Verify PHP version
      - name: Verify PHP version
        run: php -v

      # Step 4: Install Composer dependencies
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      # Step 5: PHP syntax check
      - name: PHP Syntax Check
        run: |
          find src -name "*.php" -print0 | xargs -0 -n1 php -l

      # Step 6: Prepare build directory
      - name: Prepare build
        run: |
          mkdir -p build
          cp -r src build/src
          cp composer.json build/
          cp composer.lock build/

      # Step 7: Create artifact ZIP
      - name: Package artifact
        run: |
          cd build
          zip -r Test_PHP_${{ github.run_number }}.zip .

      # Step 8: Upload artifact
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test_PHP_Build
          path: build/Test_PHP_*.zip
