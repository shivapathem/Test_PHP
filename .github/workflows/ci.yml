name: PHP CI + SonarQube
 
on:
  push:
    branches:
      - dev
      - qa
  pull_request:
    branches:
      - dev
      - qa
 
jobs:
  build-and-analyze:
    runs-on:
      - self-hosted
      - windows
 
    defaults:
      run:
        shell: powershell
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
 
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: xdebug, fileinfo, mbstring, openssl, pdo, curl, xml
 
      - name: Install Dependencies
        working-directory: src/mvc-app
        run: composer install --no-interaction --prefer-dist --no-progress
 
      # ✅ FIXED: Only AllocateUsers + correct Windows path
      - name: Run AllocateUsers Tests
        working-directory: src/mvc-app
        run: |
          .\vendor\bin\phpunit tests/Unit/AllocateUsers --log-junit test-report.xml --coverage-clover coverage.xml
 
      # ✅ FIXED: SonarQube using CLI (works on Windows)
      - name: Download SonarScanner
        run: |
          Invoke-WebRequest -Uri https://binaries.sonarsource.com/Distribution/sonar-scanner-cli/sonar-scanner-cli-latest-windows.zip -OutFile sonar.zip
          Expand-Archive sonar.zip -DestinationPath .
          Rename-Item (Get-ChildItem -Directory | Where-Object {$_.Name -like "sonar-scanner-*"}).Name sonar-scanner
 
      - name: Run SonarQube Scan
        run: |
          .\sonar-scanner\bin\sonar-scanner.bat `
          -Dsonar.projectKey=allocate7_fast_bau_scheduling_group `
          -Dsonar.projectName="Allocate7 Fast Bau Scheduling Group" `
          -Dsonar.sources=src/mvc-app `
          -Dsonar.tests=src/mvc-app/tests/Unit/AllocateUsers `
          -Dsonar.php.tests.reportPath=src/mvc-app/test-report.xml `
          -Dsonar.php.coverage.reportPaths=src/mvc-app/coverage.xml `
          -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} `
          -Dsonar.login=${{ secrets.SONAR_TOKEN }}
 
