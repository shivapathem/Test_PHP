name: PHP CI + SonarQube
 
on:
  push:
    branches: [dev, qa]
  pull_request:
    branches: [dev, qa]
 
jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
 
    steps:
      # Checkout code
      - name: Checkout Code
        uses: actions/checkout@v4
 
      # Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: xdebug, fileinfo, mbstring, openssl, pdo, curl, xml
          coverage: xdebug
 
      # Cache Composer dependencies (faster builds)
      - name: Cache Composer
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
 
      # Install dependencies
      - name: Install Dependencies
        working-directory: src/mvc-app
        run: composer install --no-interaction --prefer-dist --no-progress
 
      # Run PHPUnit tests
      - name: Run PHPUnit Tests
        working-directory: src/mvc-app
        run: |
          vendor/bin/phpunit tests/Unit/AllocateUsers \
          --log-junit test-report.xml \
          --coverage-clover coverage.xml
 
      # SonarQube Scan (official, no manual setup)
       - name: SonarQube Scan
        shell: cmd
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          sonar-scanner.bat
          -Dsonar.projectKey=Test_PHP
          -Dsonar.projectName="Test_PHP"
          -Dsonar.sources=src
          -Dsonar.tests=tests
          -Dsonar.exclusions=vendor/**
          -Dsonar.php.coverage.reportPaths=coverage.xml
          -Dsonar.php.tests.reportPath=junit.xml
          -Dsonar.host.url=%SONAR_HOST_URL%
          -Dsonar.login=%SONAR_TOKEN%
 
