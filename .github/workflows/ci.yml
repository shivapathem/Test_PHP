
name: CI-CD Deploy PHP Application to IIS

on:
  push:
    branches:
      - main

jobs:
  ci-cd-iis:
    name: Build and Deploy PHP App to IIS
    runs-on: [self-hosted, windows, x64]

    steps:
      # ------------------------------------------------------------
      # Step 1: Checkout source code (CI)
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Step 2: Verify PHP availability (CI)
      # ------------------------------------------------------------
      - name: Verify PHP installation
        shell: pwsh
        run: php -v

      # ------------------------------------------------------------
      # Step 3: PHP Syntax Check (CI)
      # ------------------------------------------------------------
      - name: PHP Syntax Check
        shell: pwsh
        run: |
          Write-Host "Running PHP syntax validation..."
          Get-ChildItem -Recurse -Filter *.php . |
          ForEach-Object { php -l $_.FullName }

      # ------------------------------------------------------------
      # Step 4: Stop IIS Website (CD)
      # ------------------------------------------------------------
      - name: Stop IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "Default Web Site"

      # ------------------------------------------------------------
      # Step 5: Deploy application files to IIS directory (CD)
      # ------------------------------------------------------------
      - name: Deploy application to IIS
        shell: pwsh
        run: |
          Copy-Item -Path .\* `
                    -Destination "C:\inetpub\wwwroot\TestPHP" `
                    -Recurse `
                    -Force `
                    -Exclude ".git",".github","node_modules"

      # ------------------------------------------------------------
      # Step 6: Start IIS Website (CD)
      # ------------------------------------------------------------
      - name: Start IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Start-Website -Name "Default Web Site"

      # ------------------------------------------------------------
      # Step 7: Verify IIS Site Status (Post-deploy check)
      # ------------------------------------------------------------
      - name: Verify IIS Website State
        shell: pwsh
        run: |
          Get-Website | Select-Object Name, State
