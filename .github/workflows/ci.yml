name: PHP CI Build with Artifacts

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build PHP Application
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------------------------
      # Step 1: Checkout Source Code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Step 2: Setup PHP & Composer
      # ------------------------------------------------------------
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Verify PHP version
        run: php -v

      # ------------------------------------------------------------
      # Step 3: Install Dependencies (FIXED)
      # ------------------------------------------------------------
      # NOTE:
      # ❌ Removed --optimize-autoloader
      # ✅ Prevents recursive scanning of system directories (/etc/*)
      # ✅ Fixes permission denied error
      - name: Install Composer dependencies
        run: |
          composer install \
            --no-interaction \
            --prefer-dist \
            --no-progress \
            --no-scripts

      # ------------------------------------------------------------
      # Step 4: PHP Syntax Validation
      # ------------------------------------------------------------
      - name: PHP Syntax Check
        run: |
          echo "Running PHP syntax check..."
          find src -name "*.php" -print0 | xargs -0 -n1 php -l

      # ------------------------------------------------------------
      # Step 5: Prepare Build Directory
      # ------------------------------------------------------------
      - name: Prepare build directory
        run: |
          mkdir -p build
          cp -r src build/src
          cp composer.json build/
          cp composer.lock build/
          cp *.nuspec build/ || true
          cp README* build/ || true

      # ------------------------------------------------------------
      # Step 6: Create Artifact (ZIP)
      # ------------------------------------------------------------
      - name: Package build artifact
        run: |
          cd build
          zip -r Test_PHP_${{ github.run_number }}.zip .

      # ------------------------------------------------------------
      # Step 7: Upload Artifact
      # ------------------------------------------------------------
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test_PHP_Artifact
          path: build/Test_PHP_*.zip
