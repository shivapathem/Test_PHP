name: PHP CI + SonarQube
 
on:
  push:
    branches:
      - dev
      - qa
  pull_request:
    branches:
      - dev
      - qa
 
jobs:
  build:
    runs-on:
      - self-hosted
      - windows
 
    defaults:
      run:
        shell: powershell
 
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
 
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
 
      - name: Install Dependencies
        working-directory: src/mvc-app
        run: composer install
 
      - name: Run Tests
        working-directory: src/mvc-app
        run: |
          .\vendor\bin\phpunit ..\tests\Unit --log-junit test-report.xml --coverage-clover coverage.xml
 
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >
            -Dsonar.projectKey=allocate7_fast_bau_scheduling_group
            -Dsonar.sources=src/mvc-app
            -Dsonar.tests=src/tests/Unit
