
name: PHP CI-CD with Docker Deployment (Windows)

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build, Package & Deploy to Docker
    runs-on: [self-hosted, windows, x64]

    steps:
      # ------------------------------------------------------------
      # Step 1: Checkout code
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Step 2: Setup PHP 8.5
      # ------------------------------------------------------------
      - name: Setup PHP 8.5
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          tools: composer
          coverage: none

      - name: Verify PHP version
        run: php -v

      # ------------------------------------------------------------
      # Step 3: Install Composer dependencies (SAFE)
      # ------------------------------------------------------------
      - name: Install Composer dependencies
        run: |
          composer install `
            --no-interaction `
            --prefer-dist `
            --no-progress `
            --no-scripts

      # ------------------------------------------------------------
      # Step 4: PHP Syntax Check (excluding problematic file)
      # ------------------------------------------------------------
      - name: PHP Syntax Check
        run: |
          Write-Host "Running PHP syntax check..."
          Get-ChildItem -Recurse -Filter *.php src |
          Where-Object { $_.Name -ne "z-getscreenres.php" } |
          ForEach-Object { php -l $_.FullName }

      # ------------------------------------------------------------
      # Step 5: Prepare build directory
      # ------------------------------------------------------------
      - name: Prepare build directory
        run: |
          New-Item -ItemType Directory -Force build
          Copy-Item src build/src -Recurse
          Copy-Item composer.json build/
          Copy-Item composer.lock build/

      # ------------------------------------------------------------
      # Step 6: Create ZIP artifact
      # ------------------------------------------------------------
      - name: Create build artifact
        run: |
          Compress-Archive -Path build\* -DestinationPath Test_PHP_${{ github.run_number }}.zip

      # ------------------------------------------------------------
      # Step 7: Upload artifact
      # ------------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Test_PHP_Artifact
          path: Test_PHP_${{ github.run_number }}.zip

      # ------------------------------------------------------------
      # Step 8: Docker Build
      # ------------------------------------------------------------
      - name: Docker build
        run: |
          docker build -t test_php_app:latest .

      # ------------------------------------------------------------
      # Step 9: Stop & Remove existing container (if any)
      # ------------------------------------------------------------
      - name: Remove existing container
        run: |
          docker rm -f test_php_container 2>$null || echo "No existing container"

      # ------------------------------------------------------------
      # Step 10: Run Docker container (DEPLOY)
      # ------------------------------------------------------------
      - name: Run container
        run: |
          docker run -d `
            --name test_php_container `
            -p 8080:80 `
            test_php_app:latest
