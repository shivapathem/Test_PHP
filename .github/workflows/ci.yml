name: CI-CD PHP App with Artifacts to IIS

on:
  push:
    branches:
      - main

jobs:
# ============================================================
# CI JOB – BUILD & PACKAGE ARTIFACT
# ============================================================
  build:
    name: CI - Build & Package Artifact
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Install dependencies (Root)
      # -----------------------
      - name: Install Composer dependencies (root)
        shell: pwsh
        run: |
          composer install `
            --no-interaction `
            --no-progress `
            --prefer-dist `
            --optimize-autoloader

      # -----------------------
      # Install dependencies (MVC App)
      # -----------------------
      - name: Install Composer dependencies (src/mvc-app)
        shell: pwsh
        run: |
          cd src/mvc-app
          composer install `
            --no-interaction `
            --no-progress `
            --prefer-dist `
            --optimize-autoloader

      # -----------------------
      # Create ZIP artifact
      # -----------------------
      - name: Create artifact ZIP
        shell: pwsh
        run: |
          Compress-Archive `
            -Path .\* `
            -DestinationPath app-artifact.zip `
            -Force

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: php-app-artifact
          path: app-artifact.zip

# ============================================================
# CD JOB – DEPLOY ARTIFACT TO IIS
# ============================================================
  deploy:
    name: CD - Deploy Artifact to IIS
    needs: build
    runs-on: [self-hosted, windows, x64]

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: php-app-artifact

      - name: Stop IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Stop-Website -Name "Default Web Site"

      - name: Deploy artifact to IIS
        shell: pwsh
        run: |
          Expand-Archive `
            -Path app-artifact.zip `
            -DestinationPath "C:\inetpub\wwwroot\TestPHP" `
            -Force

      - name: Start IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Start-Website -Name "Default Web Site"

      - name: Verify IIS Website
        shell: pwsh
        run: |
          Import-Module WebAdministration
          Get-Website | Select-Object Name, State
