
name: PHP CI-CD using Docker (Windows Runner)

# ------------------------------------------------------------
# Trigger: Run pipeline on every push to main branch
# ------------------------------------------------------------
on:
  push:
    branches:
      - main

# ------------------------------------------------------------
# Job Definition
# ------------------------------------------------------------
jobs:
  docker-ci-cd:
    name: Build and Deploy PHP App using Docker
    runs-on: [self-hosted, windows, x64]

    steps:
      # ------------------------------------------------------------
      # Step 1: Checkout source code from GitHub
      # ------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Step 2: Verify Docker is available on runner
      # (Helpful for troubleshooting)
      # ------------------------------------------------------------
      - name: Verify Docker installation
        run: docker version

      # ------------------------------------------------------------
      # Step 3: Build Docker image
      # Dockerfile handles:
      #  - PHP installation
      #  - Required extensions (gd, zip)
      #  - Composer install
      # ------------------------------------------------------------
      - name: Build Docker image
        run: |
          docker build `
            -t test_php_app:latest `
            .

      # ------------------------------------------------------------
      # Step 4: Stop & remove existing container if it exists
      # Prevents port conflicts & stale deployments
      # ------------------------------------------------------------
      - name: Stop existing container (if any)
        run: |
          docker rm -f test_php_container || echo "No existing container found"

      # ------------------------------------------------------------
      # Step 5: Run new container (DEPLOYMENT)
      # App will be accessible on:
      # http://localhost:8080
      # ------------------------------------------------------------
      - name: Run Docker container
        run: |
          docker run -d `
            --name test_php_container `
            -p 8080:80 `
            test_php_app:latest

      # ------------------------------------------------------------
      # Step 6: Optional – Show running containers (confirmation)
      # ------------------------------------------------------------
      - name: Verify running containers
        run: docker ps
